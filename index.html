<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="google-site-verification" content="MLkhPhOnFhaY-3m-DAdq1uUGy_SaljYU5tWw62sz0Z4" />

    <!-- Favicon (separate SVG file at repo root) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#2e7d32" />

    <!-- Identity -->
    <title>Garden — Local-First Markdown Wiki That Lives in Your Browser (OPFS)</title>
    <meta
      name="description"
      content="Garden is a free, open-source, local-first Markdown wiki that runs entirely in your browser. Pages are stored privately in OPFS with wikilinks, automatic backlinks, a Mermaid link graph, and full-text fuzzy search. No server, no account, no tracking, works offline."
    />
    <meta
      name="keywords"
      content="markdown wiki, local-first, OPFS, digital garden, note taking, offline wiki, wikilinks, backlinks, knowledge graph, second brain, browser storage, privacy, vue, vuetify, mermaid, agpl"
    />
    <meta name="author" content="Swastik Chatterjee" />
    <meta name="creator" content="Swastik Chatterjee" />
    <meta name="publisher" content="Swastik Chatterjee" />
    <link rel="author" href="https://github.com/swastik-chatterjee" />
    <link rel="canonical" href="https://garden-avc.pages.dev/" />

    <!-- Crawlers and indexing -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="google" content="nositelinkssearchbox" />
    <meta name="google" content="notranslate" />
    <meta name="rating" content="general" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="distribution" content="global" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />

    <!-- PWA / theming -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2e7d32" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="Garden" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Garden" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Garden" />
    <meta property="og:title" content="Garden — Local-First Markdown Wiki That Lives in Your Browser" />
    <meta
      property="og:description"
      content="A private Markdown wiki stored in your browser's OPFS. Wikilinks, backlinks, link graph, and full-text search — no server, no account."
    />
    <meta property="og:url" content="https://garden-avc.pages.dev/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image:alt" content="Garden — a local OPFS wiki" />
    <!-- Add when you have a preview image, e.g. 1200x630:
    <meta property="og:image" content="https://garden-avc.pages.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" /> -->

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Garden — Local-First Markdown Wiki in Your Browser" />
    <meta
      name="twitter:description"
      content="A private Markdown wiki that lives entirely in your browser. Wikilinks, backlinks, link graph, and search — no server, no account."
    />
    <meta name="twitter:image:alt" content="Garden — a local OPFS wiki" />

    <!-- Performance hints -->
    <link rel="preconnect" href="https://garden-avc.pages.dev" crossorigin />
    <link rel="dns-prefetch" href="https://garden-avc.pages.dev" />

  </head>
  <body>
    <div id="app"></div>
    <noscript>
      Garden is a free, open-source, local-first Markdown wiki that runs
      entirely in your browser. Pages are stored privately in the browser's
      Origin Private File System (OPFS) — no server, no account, no tracking.
      Features include Markdown pages with YAML frontmatter and tags,
      [[wikilinks]], automatic backlinks, a Mermaid link graph, full-text
      search with fuzzy matching, and separate light and dark themes.
      JavaScript is required to run Garden.
    </noscript>
    <script type="module" src="/src/main.js"></script>
